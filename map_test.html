<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Map Path Test</title>
<style>
  body { font-family: monospace; background: #111; color: #e0e0e0; padding: 20px; }
  h2 { color: #4ade80; margin: 20px 0 10px; }
  .test-case { background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 14px; margin: 10px 0; }
  .test-case h3 { margin: 0 0 8px; }
  .pass { color: #4ade80; }
  .fail { color: #f87171; }
  .info { color: #60a5fa; }
  .path-node { display: inline-block; background: #1e3a5f; padding: 2px 8px; border-radius: 4px; margin: 2px; font-size: 12px; }
  .path-gate { background: #5f1e1e; }
  .path-building { background: #1e5f3a; }
  .path-junction { background: #3a3a1e; }
  .scenario-btn { display: block; width: 100%; text-align: left; padding: 10px; margin: 6px 0; border: 1px solid #444; border-radius: 6px; background: #222; color: #ddd; cursor: pointer; font-family: inherit; font-size: 13px; }
  .scenario-btn:hover { background: #333; }
  #results { margin-top: 20px; }
</style>
</head>
<body>
<p class="info">All tests use OLFU Valenzuela calibration GPS points. No real location needed.</p>

<button class="scenario-btn" onclick="runAll()">Run All Tests</button>
<button class="scenario-btn" onclick="runGate1ToJSB()">Gate 1 - JSB</button>
<button class="scenario-btn" onclick="runGate1ToVMS()">Gate 1 - VMS</button>
<button class="scenario-btn" onclick="runGate1ToRegistrar()">Gate 1 - Registrar</button>
<button class="scenario-btn" onclick="runGate2ToSJBH()">Gate 2 - SJBH</button>
<button class="scenario-btn" onclick="runGate3ToSCH()">Gate 3 - SCH</button>
<button class="scenario-btn" onclick="runGate4ToSPCB()">Gate 4 - SPCB</button>
<button class="scenario-btn" onclick="runGate1ToCanteen()">Gate 1 - Canteen</button>
<button class="scenario-btn" onclick="runJSBtoSPCB()">JSB - SPCB (cross-campus)</button>
<button class="scenario-btn" onclick="runWalkingProgress()">Walking Progress (8 waypoints)</button>
<button class="scenario-btn" onclick="runResolveBugTest()">JSB resolveBuildingId bug fix</button>

<div id="results"></div>

<script src="map_test_core.js"></script>
</body>
</html>
